# Platform support and current-environment availability are separate facts.
# New evidence may qualify alternative routes, but a fixed constraint may only
# be cleared after Ryan explicitly confirms that the entitlement premise changed.
environment_constraints:
  policy: existing_entitlements_only
  reevaluate_only_after_explicit_user_change: true
  capability_availability:
    declarative_agent.create:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: No Lab B create operation has been executed; read-only route preflight is blocked on recorded verification gaps.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    declarative_agent.validate:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: No Lab B project has been validated.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    declarative_agent.package:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: No Lab B project has been packaged.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    declarative_agent.provision:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: No Lab B deployment route or target has been verified.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    agents_toolkit.authenticated_operations:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: The expected account was absent from the local Agents Toolkit connected-account list.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    wiqd.auth:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: TRANSIENT_AUTH_STATE_NOT_PERSISTED
      blocker: No durable authentication assertion is retained; no agent lifecycle operation has been tested.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    wiqd.direct_user_share:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: Microsoft documents direct-user sharing, but account-specific eligibility has not been tested.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    microsoft_365_copilot.access:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: TRANSIENT_BROWSER_SESSION_NOT_PERSISTED
      blocker: No durable browser-session assertion is retained.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    azure.subscription_access_for_provisioning:
      platform_capability: documented
      environment_availability: unverified
      classification: UNVERIFIED
      evidence_state: NOT_TESTED
      blocker: Azure subscription access for the selected provision operation has not been verified.
      evidence: docs/qualification-labs/declarative-agent-lab-b.md
    copilot_studio.agent_inventory:
      platform_capability: documented
      environment_availability: unavailable
      classification: FIXED_ENVIRONMENT_CONSTRAINT
      evidence_state: BLOCKED
      blocker: Development identity lacks prvReadbot; additional privilege is outside this program.
      evidence: docs/qualification-labs/copilot-studio-mcp-probe-a.md
    agents_toolkit.custom_app_upload:
      platform_capability: documented
      environment_availability: unavailable
      classification: FIXED_ENVIRONMENT_CONSTRAINT
      evidence_state: BLOCKED
      blocker: Custom-app upload and sideloading are disabled for the current account; policy enablement is outside this program.
      evidence: docs/supported-platforms.md
    workiq.upstream_service_principal:
      platform_capability: documented
      environment_availability: unavailable
      classification: FIXED_ENVIRONMENT_CONSTRAINT
      evidence_state: BLOCKED
      blocker: Required Work IQ service principal is missing and administrator creation or consent is outside this program.
      evidence: docs/supported-platforms.md
    workiq.direct_mcp:
      platform_capability: supported_preview
      environment_availability: unavailable
      classification: FIXED_ENVIRONMENT_CONSTRAINT
      evidence_state: NOT_TESTED
      blocker: Tenant, permission, service-principal, enablement, and billing/Copilot Credit prerequisites are not available under the current program premise.
      evidence: docs/supported-platforms.md
    github_copilot_harness:
      platform_capability: documented
      environment_availability: unavailable
      classification: FIXED_ENVIRONMENT_CONSTRAINT
      evidence_state: BLOCKED
      blocker: Required GitHub Copilot/Copilot Credits are unavailable to this program.
      evidence: config/constraints.yaml
    work_iq.host_composition:
      platform_capability: documented
      environment_availability: available
      classification: CURRENT_ENVIRONMENT_AVAILABLE
      evidence_state: available
      blocker: null
  qualification:
    fixed_environment_constraint_result: CAPABILITY_BLOCKED_BY_FIXED_ENVIRONMENT_CONSTRAINT
    counts_as_completed_lab: true
    continue_independent_labs: true
    block_later_lab_only_when_technically_dependent: true

# Host selection belongs to the capability catalog; evidence and routing remain separate.
execution_routing:
  schema_version: 1
  hosts:
    codex_cloud:
      role: reproducible_repository_engineering_and_public_research
    desktop_local:
      role: authenticated_microsoft_tenant_execution
  surface_preference: [mcp, cli, api_sdk, supported_editor_config, declarative_source, import_export, supported_browser_ui, browser_automation, human_action]
  configuration_surface_rule: "For agent construction/configuration, use the highest-priority operation-specific supported structured surface. Browser UI/automation requires evidence that every higher-priority route is unavailable or insufficient. Unknown availability stops for reassessment."
  configuration_capabilities:
    - copilot_studio.standard.author
    - copilot_studio.standard.manage
    - declarative_agent.create
    - declarative_agent.provision
    - agents_toolkit.custom_app_upload
    - power_automate.flow.build
    - power_automate.flow.edit
    - dataverse.solution
    - power_platform.solution.alm
  browser_automation_gate:
    requires_operation_specific_evidence: true
    reject_if_structured_route_supported: true
    reject_if_higher_route_unverified: true
    session_already_open_is_justification: false
    click_evidence_is_runtime_qualification: false
  host_fallback:
    when: preferred_host_capability_unavailable
    require_fallback_capability_support: true
    never_when_blocker: [BLOCKED_BY_TENANT_OR_POLICY, FIXED_ENVIRONMENT_CONSTRAINT, AUTH, USER_PRESENCE_REQUIRED, ADMIN_REQUIRED]
    never_to_bypass: [permissions, admin_policy, security_policy, mfa, consent, licensing, billing, production_approval, organization_publication_approval]
  browser_surfaces:
    persistent_identity:
      browser: chrome_stable
      profile_name: AgentFactory
      profile_requirement: dedicated_persistent_authenticated_profile
      authentication_surface: microsoft_interactive_authentication
      generic_regression: false
      absolute_profile_path_required: false
    deterministic_regression:
      browser: chrome_for_testing
      profile: disposable_isolated
      profile_requirement: disposable_user_data_directory
      generic_regression: true
      persistent_authentication: false
  authentication:
    browser_state_is_unattended_proof: false
    fresh_copilot_studio_mcp_requires: [verify_account, verify_development_environment, refresh_live_catalog]
    process_local_credentials: true
  startup_order:
    pac_mcp: [pac_authentication, start_or_restart_pac_mcp]
    copilot_studio_mcp: [connect, verify_account, verify_development_environment, refresh_live_catalog]
  evidence_states:
    labels: [DESIGNED, IMPLEMENTED, CLOUD_SYNCHRONIZED, RUNTIME_QUALIFIED, BLOCKED, FAILED, NOT_TESTED, USER_PRESENCE_REQUIRED, ADMIN_REQUIRED]
    default_state: NOT_TESTED
    tool_discovery_does_not_imply_runtime_qualification: true
  routes:
    repository_engineering:
      capabilities: [repository.engineering, repository.source_implementation, repository.reproducible_tests, package.build_validation, declarative_agent.validate, declarative_agent.package]
      preferred_host: codex_cloud
      fallback_host: desktop_local
      preferred_surface_order: [repository_tools, local_tests]
      runtime_qualification_host: codex_cloud
      known_blocker_type: [TOOL_HOST]
      human_presence_requirement: none
    public_information:
      capabilities: [public.documentation, public.research, microsoft_learn.documentation]
      preferred_host: either
      host_preference_order: [codex_cloud, desktop_local]
      fallback_host: null
      preferred_surface_order: [mcp, cli, api_sdk, browser_ui]
      runtime_qualification_host: not_applicable
      known_blocker_type: [TOOL_HOST]
      human_presence_requirement: none
    microsoft_interactive_authentication:
      capabilities: [microsoft.interactive_authentication]
      preferred_host: desktop_local
      fallback_host: codex_cloud
      preferred_surface_order: [supported_auth_flow, browser_ui, human_action]
      authentication_surface: microsoft_interactive_authentication
      browser_surface: chrome_stable
      browser_profile_requirement: AgentFactory
      runtime_qualification_host: desktop_local
      known_blocker_type: [AUTH, USER_PRESENCE_REQUIRED, ADMIN_REQUIRED, BLOCKED_BY_TENANT_OR_POLICY]
      human_presence_requirement: when_mfa_or_consent_requires
    power_platform_tenant_operations:
      capabilities: [power_platform.authenticated_operations, power_platform.development_operations, power_platform.pac_mcp, copilot_studio.standard.author, copilot_studio.standard.manage, copilot_studio.standard.test, power_automate.connector.discover, power_automate.flow.build, power_automate.flow.edit, power_automate.flow.validate, power_automate.flow.preflight, power_automate.flow.execute, power_automate.flow.diagnose, dataverse.metadata, dataverse.data, dataverse.security, dataverse.admin, dataverse.solution, power_platform.solution.alm, agent.evaluate]
      preferred_host: desktop_local
      fallback_host: codex_cloud
      preferred_surface_order: [mcp, cli, api_sdk, supported_browser_ui]
      authentication_surface: pac_or_supported_microsoft_auth
      runtime_qualification_host: desktop_local
      known_blocker_type: [BLOCKED_BY_TENANT_OR_POLICY, AUTH, ADMIN_REQUIRED]
      human_presence_requirement: when_mfa_or_consent_requires
      host_fallback_condition: host_or_surface_unavailable_only
    copilot_studio_mcp:
      capabilities: [copilot_studio.mcp, copilot_studio.environment_selection, copilot_studio.agent_inventory]
      preferred_host: desktop_local
      fallback_host: codex_cloud
      preferred_surface_order: [mcp, cli, api_sdk, supported_browser_ui]
      authentication_surface: copilot_studio_mcp_supported_sign_in
      browser_surface: chrome_stable
      browser_profile_requirement: AgentFactory
      runtime_qualification_host: desktop_local
      known_blocker_type: [BLOCKED_BY_TENANT_OR_POLICY, AUTH, USER_PRESENCE_REQUIRED, ADMIN_REQUIRED]
      human_presence_requirement: when_mfa_or_consent_requires
      host_fallback_condition: host_or_surface_unavailable_only
    agents_toolkit:
      capabilities: [agents_toolkit.authenticated_operations, agents_toolkit.custom_app_upload, declarative_agent.create, declarative_agent.provision]
      preferred_host: desktop_local
      fallback_host: codex_cloud
      preferred_surface_order: [cli, mcp, api_sdk, supported_browser_ui]
      authentication_surface: agents_toolkit_supported_auth
      browser_surface: chrome_stable
      browser_profile_requirement: AgentFactory
      runtime_qualification_host: desktop_local
      known_blocker_type: [BLOCKED_BY_TENANT_OR_POLICY, AUTH, USER_PRESENCE_REQUIRED, ADMIN_REQUIRED]
