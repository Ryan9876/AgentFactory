organization:
  purpose: internal_m365_agents
  development_environment_only_by_default: true
licensing:
  github_copilot_harness: disallowed
  usage_based_copilot_credits_for_agent_builds: unavailable
work_iq:
  m365_copilot: available
  host_composition_with_agents: available
  copilot_studio_embedded: disallowed
  direct_mcp_api: conditional
agent_architectures:
  declarative_agent: preferred_when_suitable
  copilot_studio_standard: allowed
  github_copilot_harness: disallowed
  custom_engine: exception_only
deployment:
  production_requires_explicit_approval: true
  organization_publish_requires_explicit_approval: true
architecture:
  prefer_native_before_custom: true
  verify_current_microsoft_docs_before_mutable_platform_decisions: true
qualification:
  entitlement_policy: existing_entitlements_only
  objective: "Determine what can reliably be built with Ryan's current permissions, licenses, credits, tenant configuration, policies, security roles, and supported development surfaces."
  fixed_for_program_unless_explicitly_changed: true
  re_evaluate_only_after: explicit_user_statement_that_an_entitlement_or_policy_changed
  unavailable_entitlement_remediation:
    allowed: false
    forbidden:
      - request_elevated_privileges_or_security_roles
      - request_tenant_admin_permissions_or_admin_consent
      - request_additional_microsoft_365_permissions
      - request_policy_exceptions_or_sideload_enablement
      - obtain_additional_copilot_credits_or_paid_licenses
      - enable_billing_or_spending_policies
      - create_admin_approved_service_principals
      - purchase_paid_licensing
      - change_production_or_tenant-wide_settings
      - obtain_production-level_access
  qualification_blockers:
    fixed_environment_constraint_completes_lab: true
    continue_independent_labs: true
    dependent_labs_block_only_when_technically_dependent: true
